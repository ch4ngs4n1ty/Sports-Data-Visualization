<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PlayIQ — Deep Game Analysis</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#05080f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-title" content="PlayIQ" />
  <link rel="apple-touch-icon" href="icon.svg" />

  <!-- Production backend URL. The data layer auto-detects local dev (when
       the page is served from localhost/127.0.0.1/file://) and uses
       http://localhost:3001 instead, so this can stay set to the deployed
       URL permanently — no need to flip it back and forth. -->
  <meta name="piq-api-base" content="https://playiq-backend-883n.onrender.com" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!-- Shared + sport-specific data layer -->
  <script src="frontend/data/shared/core.js"></script>
  <script src="frontend/data/mlb/index.js"></script>
  <script src="frontend/data/mlb/live-stream.js?v=reconnect-1"></script>
  <script src="frontend/data/mlb/indicators.js"></script>
  <script src="frontend/data/nba/index.js"></script>
  <script src="frontend/data/wnba/index.js"></script>
  <script src="frontend/data/nfl/index.js?v=nfl-edge-1"></script>
  <script src="frontend/data/nfl/live.js?v=stadium-1"></script>
  <script src="frontend/data/nfl/live-stream.js"></script>
  <link rel="stylesheet" href="frontend/sports/nfl/live.css?v=stadium-1">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ══════════════════════════════════════════════════════════
       DESIGN TOKENS
       The legacy names (--bg/--card/--cyan/--text/--muted/--dim)
       are kept so the ~2,600 lines of sport-specific tabs pick up
       the new palette without being touched. Values are retuned
       for contrast: --muted is now 7.6:1 and --dim 4.75:1 on
       --card (both were failing WCAG AA before).
       ══════════════════════════════════════════════════════════ */
    :root {
      /* ── Surfaces (ascending elevation) ──
         Surfaces now carry a faint hue that follows the active sport accent
         (--accent-h/s), so re-theming tints the whole page, not just the
         highlights. Falls back to the navy values when no sport is set. */
      --bg:        #05080f;
      --surface:   #0a1020;
      --card:      #0e1626;
      --card-hi:   #142038;
      --raised:    #18243c;

      /* ── THEME ENGINE ──────────────────────────────────
         Every sport tab in the app reads var(--cyan) for its accent. Rather
         than touch ~4,000 lines of sport files, --cyan is redefined per sport
         from these three channels. Setting data-sport on <html> re-themes the
         ENTIRE app — chrome, cards, charts, glows — in one assignment.
         --accent-h / -s / -l are the source of truth; --cyan is the alias the
         legacy code already consumes. */
      --accent-h:  193;
      --accent-s:  100%;
      --accent-l:  50%;

      --accent:       hsl(var(--accent-h) var(--accent-s) var(--accent-l));
      --accent-soft:  hsl(var(--accent-h) var(--accent-s) var(--accent-l) / 0.14);
      --accent-line:  hsl(var(--accent-h) var(--accent-s) var(--accent-l) / 0.32);
      --accent-glow:  hsl(var(--accent-h) var(--accent-s) var(--accent-l) / 0.45);
      --accent-deep:  hsl(var(--accent-h) var(--accent-s) 12%);

      /* Secondary accent — sits opposite the primary on the wheel so
         two-series charts and comparison boards read as a real pair. */
      --accent-2:     hsl(calc(var(--accent-h) + 52) 92% 62%);

      /* ── Accents ── */
      --cyan:      var(--accent);      /* legacy alias → now sport-aware */
      --cyan-fixed:#00d4ff;            /* when you specifically need cyan */
      --green:     #00ff88;
      --orange:    #ff6b35;
      --gold:      #ffd060;
      --violet:    #a855f7;
      --pink:      #ff4d8d;

      /* ── Text ramp ── */
      --text:      #dce9f7;   /* primary        ~15:1  */
      --muted:     #93aac6;   /* secondary      ~7.6:1 */
      --dim:       #6b87a8;   /* tertiary/label ~4.75:1 */
      --faint:     #40587a;   /* decorative only, never text */

      /* ── Lines & tints ── */
      --line:        rgba(147, 170, 198, 0.10);
      --line-strong: rgba(147, 170, 198, 0.20);
      --line-accent: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / 0.30);
      --tint-cyan:   hsl(var(--accent-h) var(--accent-s) var(--accent-l) / 0.08);
      --tint-green:  rgba(0, 255, 136, 0.08);
      --tint-orange: rgba(255, 107, 53, 0.08);
      --tint-gold:   rgba(255, 208, 96, 0.08);

      /* ── Spacing scale (4px base) ── */
      --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
      --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;

      /* ── Type scale ── */
      --fs-micro: 11px;  /* was 8–9px: uppercase tracking labels */
      --fs-xs:    12px;  /* was 9–10px: meta, captions           */
      --fs-sm:    13px;  /* was 11px:   body                     */
      --fs-md:    15px;  /* emphasis body                        */
      --fs-lg:    18px;
      --fs-xl:    24px;

      /* ── Radius ── */
      --r-xs: 3px; --r-sm: 5px; --r-md: 8px; --r-lg: 12px;

      /* ── Motion (snappy by preference) ── */
      --dur-1: 120ms;   /* charts, bars            */
      --dur-2: 150ms;   /* cards, hovers           */
      --dur-3: 220ms;   /* screen transitions      */
      --dur-4: 420ms;   /* theme cross-fade, reveals */
      --ease:  cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

      /* ── Elevation ──
         Layered shadows (ambient + direct) instead of one flat blur; this is
         most of the difference between "a div with a box-shadow" and a
         surface that looks like it occupies space. */
      --sh-1: 0 1px 2px rgba(0,0,0,0.4);
      --sh-2: 0 2px 4px rgba(0,0,0,0.30), 0 6px 18px rgba(0,0,0,0.42);
      --sh-3: 0 4px 10px rgba(0,0,0,0.34), 0 18px 48px rgba(0,0,0,0.55);
      --sh-accent: 0 8px 30px hsl(var(--accent-h) var(--accent-s) 40% / 0.22);

      /* ── Layout ── */
      --maxw: 1180px;
      --nav-h: 56px;

      --scanlines-opacity: 1;
      --grid-line: hsl(var(--accent-h) var(--accent-s) var(--accent-l) / 0.035);
    }

    /* ══════════════════════════════════════════════════════════
       PER-SPORT THEMES
       One attribute on <html> re-colors the whole application.
       Hues are chosen to match how each league is actually seen
       (NBA hardwood-ember, NFL turf-green, NHL ice-blue) and to
       stay ≥4.5:1 against --card at the given lightness.
       ══════════════════════════════════════════════════════════ */
    :root[data-sport="mlb"]    { --accent-h: 193; --accent-s: 100%; --accent-l: 50%; }
    :root[data-sport="nba"]    { --accent-h:  18; --accent-s: 100%; --accent-l: 60%; }
    :root[data-sport="wnba"]   { --accent-h: 280; --accent-s:  92%; --accent-l: 68%; }
    :root[data-sport="nfl"]    { --accent-h: 152; --accent-s:  90%; --accent-l: 52%; }
    :root[data-sport="nhl"]    { --accent-h: 210; --accent-s:  95%; --accent-l: 66%; }
    :root[data-sport="ncaamb"] { --accent-h:  45; --accent-s:  95%; --accent-l: 60%; }

    /* The accent transition is what makes sport switching feel designed
       rather than abrupt — the entire page cross-fades its hue. */
    :root { transition: --accent-h var(--dur-4) linear; }
    @property --accent-h { syntax: '<number>'; inherits: true; initial-value: 193; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: var(--fs-sm);
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* Scanlines — lighter than before so they read as texture, not noise */
    body::after {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
      opacity: var(--scanlines-opacity);
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.028) 3px, rgba(0,0,0,0.028) 4px);
      transition: opacity var(--dur-2) ease;
    }

    /* Grid backdrop. Perspective-scaled rows (the grid cells get taller as
       they recede) so the floor reads as a plane going back, not flat paper. */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 54px 54px, 54px 54px;
      -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 38%, transparent 88%);
      mask-image: linear-gradient(180deg, #000 0%, #000 38%, transparent 88%);
    }

    /* ── Ambient aurora ───────────────────────────────────────
       Two large, slowly drifting accent blooms behind everything. This is
       what removes the "flat navy rectangle" feeling: the background is
       never quite the same twice, so surfaces read as lit rather than filled.
       Sits at z-index 0 under #root, and is inert to pointer events. */
    .piq-aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .piq-aurora span {
      position: absolute; display: block; border-radius: 50%;
      filter: blur(90px); opacity: 0.5; will-change: transform;
    }
    .piq-aurora span:nth-child(1) {
      width: 58vw; height: 46vw; left: -10vw; top: -18vw;
      background: radial-gradient(circle, hsl(var(--accent-h) var(--accent-s) 46% / 0.34), transparent 66%);
      animation: aurora 26s ease-in-out infinite;
    }
    .piq-aurora span:nth-child(2) {
      width: 50vw; height: 40vw; right: -12vw; top: -8vw;
      background: radial-gradient(circle, hsl(calc(var(--accent-h) + 52) 88% 52% / 0.20), transparent 68%);
      animation: aurora 34s ease-in-out infinite reverse;
    }
    /* A single scan bar crawling down the viewport — the strongest "this is a
       live instrument" cue, and cheap (one transform-animated element). */
    .piq-aurora i {
      position: absolute; left: 0; right: 0; height: 28vh;
      background: linear-gradient(180deg, transparent,
        hsl(var(--accent-h) var(--accent-s) 60% / 0.05) 48%, transparent);
      animation: scanDown 13s linear infinite; mix-blend-mode: screen;
    }

    /* ── 3D floor ──────────────────────────────────────────────
       A real perspective plane, not a faked gradient: the grid is a flat
       element rotated back on X inside a `perspective` parent, so the rows
       genuinely converge at a horizon. Translating it along Z (toward the
       camera) makes the floor scroll under the UI — the Tron/HUD cue.

       Two details keep it from looking cheap:
       - `background-position` is NOT animated; the element itself moves in Z.
         Animating position gives even row spacing (flat scroll). Moving in Z
         gives accelerating rows, which is what reads as depth.
       - it is masked to fade out AT the horizon, so the convergence point is
         a glow rather than a hard moiré line. */
    .piq-floor {
      position: fixed; left: 0; right: 0; bottom: 0; height: 34vh;
      z-index: 0; pointer-events: none; overflow: hidden;
      perspective: 200px; perspective-origin: 50% 0%;
      /* Faded hard at BOTH ends: at the top so the horizon is a glow rather
         than a hairline, and at the bottom so the nearest (largest, brightest)
         rows don't compete with real UI at the foot of the page. */
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 55%, #000 82%, transparent 100%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 55%, #000 82%, transparent 100%);
      opacity: var(--floor-opacity, 1);
      transition: opacity var(--dur-2) ease;
    }
    .piq-floor::before {
      content: ''; position: absolute;
      /* Oversized and centred so the plane still covers the viewport once
         it is rotated away — a 100%-wide plane would leave bare corners. */
      left: -75%; width: 250%; top: 0; height: 320%;
      background-image:
        linear-gradient(hsl(var(--accent-h) var(--accent-s) 62% / 0.13) 1px, transparent 1px),
        linear-gradient(90deg, hsl(var(--accent-h) var(--accent-s) 62% / 0.09) 1px, transparent 1px);
      background-size: 60px 60px, 60px 60px;
      transform-origin: 50% 0%;
      transform: rotateX(78deg);
      animation: floorRun 6s linear infinite;
      will-change: transform;
    }
    /* Horizon bloom — the line the floor converges into. Without it the grid
       just stops; with it the plane reads as receding into distance. */
    .piq-floor::after {
      content: ''; position: absolute; left: 0; right: 0; top: 0; height: 46%;
      background:
        radial-gradient(56% 100% at 50% 0%,
          hsl(var(--accent-h) var(--accent-s) 60% / 0.13), transparent 72%);
      mix-blend-mode: screen;
    }

    /* ── Particle field ────────────────────────────────────────
       Canvas because the effect needs per-frame distance math (each mote has
       a z, is projected to 2D, and respawns at the back when it passes the
       camera). CSS can't do that for ~90 independent bodies without ~90
       animated elements. It draws only when the tab is visible, and it is the
       one piece that reads as genuinely volumetric rather than layered. */
    .piq-particles {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      opacity: var(--particles-opacity, 0.85);
      transition: opacity var(--dur-2) ease;
    }

    #root { position: relative; z-index: 1; min-height: 100vh; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.16); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(0,212,255,0.32); background-clip: padding-box; }

    /* ── Keyframes ─────────────────────────────────────────── */
    @keyframes livePulse     { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
    @keyframes fadeUp        { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes glowPulse     { 0%,100%{text-shadow:0 0 10px var(--accent-soft)} 50%{text-shadow:0 0 26px var(--accent-glow),0 0 52px var(--accent-soft)} }
    @keyframes shimmer       { 0%{left:-100%} 100%{left:200%} }
    @keyframes skeletonPulse { 0%,100%{opacity:0.4} 50%{opacity:0.7} }

    /* Entrance: rises, scales in slightly, and un-blurs. The blur is what
       makes it read as "resolving into focus" rather than just sliding. */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px) scale(0.985); filter: blur(6px); }
      to   { opacity: 1; transform: translateY(0)    scale(1);     filter: blur(0); }
    }
    /* A bar/gauge growing from its baseline */
    @keyframes growUp    { from { transform: scaleY(0);   opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
    @keyframes growRight { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    /* A light sweeping across a surface once, on entrance */
    @keyframes sweep { 0% { transform: translateX(-120%) skewX(-18deg); opacity: 0; }
                       36% { opacity: 1; }
                       100% { transform: translateX(320%) skewX(-18deg); opacity: 0; } }

    /* Ambient: a scan bar that crawls down the HUD, and a slow aurora drift */
    @keyframes scanDown { 0% { top: -12%; opacity: 0; } 12% { opacity: 1; }
                          88% { opacity: 1; } 100% { top: 108%; opacity: 0; } }
    @keyframes aurora {
      0%   { transform: translate3d(-4%, -2%, 0) scale(1.05); }
      50%  { transform: translate3d( 4%,  3%, 0) scale(1.18); }
      100% { transform: translate3d(-4%, -2%, 0) scale(1.05); }
    }
    /* The floor plane travelling toward the camera. It moves exactly ONE grid
       cell (60px) in the plane's own space, so the loop point lands on the
       next row and the motion is seamless — any other distance would visibly
       jump every cycle. */
    @keyframes floorRun {
      from { transform: rotateX(78deg) translate3d(0, 0, 0); }
      to   { transform: rotateX(78deg) translate3d(0, 60px, 0); }
    }
    @keyframes borderRun { to { background-position: 200% 0; } }
    @keyframes popIn { from { opacity:0; transform: scale(0.82); } to { opacity:1; transform: scale(1); } }

    .screen-enter { animation: riseIn var(--dur-4) var(--ease-out); }

    /* ── Staggered reveal ────────────────────────────────────
       Put .stagger on a container; its children animate in sequence.
       Depth is capped at 14 so a 200-row table doesn't wait 6 seconds. */
    .stagger > * { animation: riseIn 380ms var(--ease-out) backwards; }
    .stagger > *:nth-child(1){animation-delay:0ms}    .stagger > *:nth-child(2){animation-delay:38ms}
    .stagger > *:nth-child(3){animation-delay:76ms}   .stagger > *:nth-child(4){animation-delay:114ms}
    .stagger > *:nth-child(5){animation-delay:152ms}  .stagger > *:nth-child(6){animation-delay:190ms}
    .stagger > *:nth-child(7){animation-delay:228ms}  .stagger > *:nth-child(8){animation-delay:266ms}
    .stagger > *:nth-child(9){animation-delay:304ms}  .stagger > *:nth-child(10){animation-delay:342ms}
    .stagger > *:nth-child(11){animation-delay:380ms} .stagger > *:nth-child(12){animation-delay:418ms}
    .stagger > *:nth-child(13){animation-delay:456ms} .stagger > *:nth-child(n+14){animation-delay:494ms}

    /* ── Utility effects ─────────────────────────────────── */
    /* A one-shot specular sweep — add to any positioned container */
    .sheen { position: relative; overflow: hidden; }
    .sheen::before {
      content: ''; position: absolute; inset: 0 auto 0 0; width: 42%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
      animation: sweep 1.15s var(--ease-out) 180ms 1 backwards; pointer-events: none;
    }
    /* Animated gradient border for "this is the important panel" */
    .runline {
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
      background-size: 200% 100%; animation: borderRun 3.2s linear infinite;
    }
    .glow-text { text-shadow: 0 0 18px var(--accent-glow); }
    .tabular   { font-variant-numeric: tabular-nums; }

    /* ══════════════════════════════════════════════════════════
       ACCESSIBILITY PRIMITIVES
       ══════════════════════════════════════════════════════════ */
    :where(button, a, input, textarea, select, [tabindex]):focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 2px;
      border-radius: var(--r-xs);
    }
    :where(button, a, input, textarea, select):focus { outline: none; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    .skip-link {
      position: absolute; left: var(--s3); top: -60px; z-index: 500;
      background: var(--raised); color: var(--cyan); padding: var(--s2) var(--s4);
      border: 1px solid var(--line-accent); border-radius: var(--r-sm);
      font-size: var(--fs-xs); letter-spacing: 0.12em; text-decoration: none;
      transition: top var(--dur-2) var(--ease);
    }
    .skip-link:focus { top: var(--s2); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ══════════════════════════════════════════════════════════
       TOP NAV
       ══════════════════════════════════════════════════════════ */
    .topnav {
      position: sticky; top: 0; z-index: 200;
      min-height: var(--nav-h);
      display: flex; align-items: center; gap: var(--s4);
      padding: 0 var(--s5);
      background: linear-gradient(180deg, rgba(8,13,26,0.92), rgba(5,8,15,0.78));
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border-bottom: 1px solid var(--line);
    }
    /* Accent hairline under the nav — now a live running gradient */
    .topnav::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
      background-size: 200% 100%; animation: borderRun 5s linear infinite;
      opacity: 0.75;
    }

    .brand {
      display: flex; align-items: center; gap: var(--s2);
      background: none; border: none; cursor: pointer; padding: var(--s1) 0;
      flex-shrink: 0;
    }
    .brand-mark {
      width: 22px; height: 22px; flex-shrink: 0;
      display: grid; place-items: center;
      border: 1.5px solid var(--cyan); border-radius: var(--r-xs);
      color: var(--cyan); font-family: 'Orbitron', monospace; font-weight: 900;
      font-size: 12px; line-height: 1;
      box-shadow: 0 0 14px rgba(0,212,255,0.28), inset 0 0 10px rgba(0,212,255,0.12);
    }
    .logo {
      font-family: 'Orbitron', monospace; font-weight: 900; font-size: var(--fs-lg);
      color: var(--cyan); letter-spacing: 0.1em; user-select: none; line-height: 1;
      animation: glowPulse 3.5s ease-in-out infinite;
    }
    .logo span { color: rgba(0,212,255,0.38); }

    .nav-sep { width: 1px; height: 20px; background: var(--line-strong); flex-shrink: 0; }

    /* Breadcrumb — clickable trail instead of a dead string */
    .nav-bc { flex: 1; display: flex; align-items: center; gap: var(--s2); min-width: 0; overflow: hidden; }
    .bc-item {
      background: none; border: none; padding: 2px 0; cursor: default;
      font-family: 'Space Mono', monospace; font-size: var(--fs-xs);
      color: var(--dim); letter-spacing: 0.14em; white-space: nowrap;
      text-overflow: ellipsis; overflow: hidden; transition: color var(--dur-2) ease;
    }
    .bc-item.link { cursor: pointer; }
    .bc-item.link:hover { color: var(--cyan); }
    .bc-item.current { color: var(--text); font-weight: 700; }
    .bc-sep { color: var(--faint); font-size: var(--fs-xs); flex-shrink: 0; }

    .nav-status {
      display: flex; align-items: center; gap: var(--s2);
      font-size: var(--fs-micro); color: var(--dim); letter-spacing: 0.1em;
      flex-shrink: 0; padding: var(--s1) var(--s3);
      border: 1px solid var(--line); border-radius: 99px; background: var(--surface);
      max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .nav-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--green);
      box-shadow: 0 0 8px var(--green); animation: livePulse 2.2s ease-in-out infinite;
      flex-shrink: 0;
    }

    /* ── API key ─────────────────────────────────────────────── */
    .api-row { display: flex; align-items: center; gap: var(--s2); flex-shrink: 0; position: relative; }
    .api-row input {
      background: var(--surface); border: 1px solid var(--line-strong);
      color: var(--text); font-family: 'Space Mono', monospace; font-size: var(--fs-xs);
      padding: var(--s2) var(--s3); border-radius: var(--r-sm); width: 210px;
      letter-spacing: 0.04em; transition: border-color var(--dur-2) ease, box-shadow var(--dur-2) ease;
    }
    .api-row input::placeholder { color: var(--faint); }
    .api-row input:focus {
      border-color: var(--line-accent);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.10);
    }
    .api-row .saved {
      font-size: var(--fs-micro); color: var(--green); letter-spacing: 0.1em;
      white-space: nowrap; animation: fadeUp var(--dur-2) var(--ease);
    }

    /* Mobile: the key input collapses behind a toggle so the nav never overflows */
    .api-toggle { display: none; }
    .api-popover { display: contents; }

    /* ══════════════════════════════════════════════════════════
       BUTTONS
       ══════════════════════════════════════════════════════════ */
    .piq-btn {
      position: relative; overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
      font-family: 'Space Mono', monospace; font-size: var(--fs-xs); font-weight: 700;
      letter-spacing: 0.12em; padding: var(--s2) var(--s4);
      background: var(--surface); color: var(--muted);
      border: 1px solid var(--line-strong); border-radius: var(--r-sm);
      cursor: pointer; white-space: nowrap;
      transition: color var(--dur-2) ease, border-color var(--dur-2) ease,
                  background var(--dur-2) ease, transform 90ms var(--ease-spring),
                  box-shadow var(--dur-2) ease;
    }
    /* Specular sweep that crosses the button on hover */
    .piq-btn::after {
      content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.13), transparent);
      transform: skewX(-18deg); transition: left 480ms var(--ease-out); pointer-events: none;
    }
    .piq-btn:hover::after { left: 120%; }
    .piq-btn:hover {
      color: var(--text); border-color: var(--line-accent); background: var(--card-hi);
      transform: translateY(-1px);
    }
    .piq-btn:active { transform: translateY(1px) scale(0.985); }

    .piq-btn-primary {
      color: var(--accent);
      background: linear-gradient(180deg, var(--accent-soft), transparent);
      border-color: var(--line-accent);
    }
    .piq-btn-primary:hover {
      color: #04070d; border-color: var(--accent);
      background: linear-gradient(180deg, var(--accent), hsl(var(--accent-h) var(--accent-s) 42%));
      box-shadow: 0 0 28px var(--accent-glow), var(--sh-2);
    }
    .piq-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .piq-btn-ghost { background: transparent; border-color: var(--line); }

    /* Segmented control — used for away/home + stat switchers */
    .piq-seg {
      display: inline-flex; padding: 3px; gap: 3px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
    }
    .piq-seg button {
      font-family: 'Space Mono', monospace; font-size: var(--fs-xs); font-weight: 700;
      letter-spacing: 0.1em; padding: var(--s2) var(--s4);
      background: transparent; color: var(--dim); border: none;
      border-radius: var(--r-sm); cursor: pointer; white-space: nowrap;
      transition: color var(--dur-2) ease, background var(--dur-2) ease;
    }
    .piq-seg button:hover { color: var(--text); }
    .piq-seg button[aria-pressed="true"], .piq-seg button.on {
      background: var(--tint-cyan); color: var(--cyan);
      box-shadow: inset 0 0 0 1px var(--line-accent);
    }

    /* ══════════════════════════════════════════════════════════
       TABS
       ══════════════════════════════════════════════════════════ */
    .piq-tabs {
      display: flex; gap: var(--s1); overflow-x: auto; scrollbar-width: none;
      border-bottom: 1px solid var(--line);
      /* Fade the overflowing edge so it's obvious there is more to scroll */
      -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 36px), transparent 100%);
      mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 36px), transparent 100%);
    }
    .piq-tabs::-webkit-scrollbar { display: none; }
    .piq-tab {
      position: relative; padding: var(--s3) var(--s4) var(--s3);
      background: transparent; border: none; cursor: pointer; white-space: nowrap;
      font-family: 'Space Mono', monospace; font-size: var(--fs-xs); font-weight: 700;
      letter-spacing: 0.1em; color: var(--dim);
      transition: color var(--dur-2) ease;
      border-radius: var(--r-sm) var(--r-sm) 0 0;
    }
    .piq-tab:hover { color: var(--text); background: rgba(147,170,198,0.05); }
    .piq-tab::after {
      content: ''; position: absolute; left: var(--s3); right: var(--s3); bottom: -1px;
      height: 2px; border-radius: 2px 2px 0 0;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transform: scaleX(0); transform-origin: center;
      transition: transform var(--dur-3) var(--ease-spring);
    }
    /* Selected tab also gets a soft upward bloom, so the active section reads
       as lit from below rather than merely underlined. */
    .piq-tab[aria-selected="true"] {
      color: var(--accent);
      background: linear-gradient(180deg, transparent 40%, var(--accent-soft));
    }
    .piq-tab[aria-selected="true"]::after { transform: scaleX(1); box-shadow: 0 0 14px var(--accent-glow); }

    /* ══════════════════════════════════════════════════════════
       FORM CONTROLS
       ══════════════════════════════════════════════════════════ */
    .piq-input, .piq-textarea {
      background: var(--card); border: 1px solid var(--line-strong); color: var(--text);
      font-family: 'Space Mono', monospace; font-size: var(--fs-sm);
      padding: var(--s2) var(--s3); border-radius: var(--r-sm); width: 100%;
      transition: border-color var(--dur-2) ease, box-shadow var(--dur-2) ease;
    }
    .piq-input:focus, .piq-textarea:focus {
      border-color: var(--line-accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.10);
    }
    .piq-textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
    .piq-input::placeholder, .piq-textarea::placeholder { color: var(--faint); }

    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.6) sepia(1) saturate(6) hue-rotate(170deg); cursor: pointer; }
    input[type="date"] { color-scheme: dark; }

    /* ══════════════════════════════════════════════════════════
       TYPE HELPERS
       ══════════════════════════════════════════════════════════ */
    .piq-label {
      font-family: 'Space Mono', monospace; font-size: var(--fs-micro);
      color: var(--dim); letter-spacing: 0.16em; text-transform: uppercase;
    }
    .piq-num { font-family: 'Orbitron', monospace; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ══════════════════════════════════════════════════════════
       TWEAKS PANEL
       ══════════════════════════════════════════════════════════ */
    .tweaks {
      position: fixed; bottom: var(--s5); right: var(--s5); width: 244px; z-index: 300;
      background: rgba(10,16,32,0.97); border: 1px solid var(--line-accent);
      border-radius: var(--r-md); padding: var(--s4); backdrop-filter: blur(20px);
      box-shadow: var(--sh-3); display: none; font-family: 'Space Mono', monospace;
    }
    .tweaks.open { display: block; animation: fadeUp var(--dur-2) var(--ease); }
    .tw-title { font-size: var(--fs-micro); color: var(--cyan); letter-spacing: 0.22em; margin-bottom: var(--s4); }
    .tw-row   { margin-bottom: var(--s3); }
    .tw-lbl   { font-size: var(--fs-micro); color: var(--dim); letter-spacing: 0.1em; margin-bottom: var(--s2); }
    .tw-opts  { display: flex; gap: var(--s1); flex-wrap: wrap; }
    .tw-btn   {
      font-size: var(--fs-micro); font-family: 'Space Mono', monospace;
      padding: var(--s1) var(--s2); border-radius: var(--r-xs); cursor: pointer;
      border: 1px solid var(--line); background: transparent; color: var(--dim);
      transition: all var(--dur-2) ease;
    }
    .tw-btn:hover { color: var(--text); border-color: var(--line-strong); }
    .tw-btn.on { border-color: var(--cyan); color: var(--cyan); background: var(--tint-cyan); }

    /* ══════════════════════════════════════════════════════════
       RESPONSIVE
       ══════════════════════════════════════════════════════════ */
    @media (max-width: 900px) {
      .nav-status { display: none; }
    }

    /* The home sport grid is a fixed 3-up so six sports form a clean 3x2.
       It has to step down on narrower viewports or the cards get crushed. */
    @media (max-width: 860px) { .piq-sport-grid { grid-template-columns: repeat(2, 1fr) !important; } }
    @media (max-width: 520px) { .piq-sport-grid { grid-template-columns: 1fr !important; } }

    @media (max-width: 720px) {
      :root { --s5: 16px; }
      .topnav { padding: 0 var(--s4); gap: var(--s3); }
      .logo { font-size: var(--fs-md); }

      /* Collapse the API key field into a toggle + dropdown panel */
      .api-toggle {
        display: inline-flex; align-items: center; justify-content: center;
        width: 34px; height: 34px; flex-shrink: 0;
        background: var(--surface); border: 1px solid var(--line-strong);
        border-radius: var(--r-sm); color: var(--dim); cursor: pointer;
        font-size: 14px; line-height: 1; transition: all var(--dur-2) ease;
      }
      .api-toggle[aria-expanded="true"], .api-toggle.has-key { color: var(--cyan); border-color: var(--line-accent); }
      .api-popover {
        display: none; position: absolute; top: calc(100% + 10px); right: 0; z-index: 210;
        background: var(--raised); border: 1px solid var(--line-accent);
        border-radius: var(--r-md); padding: var(--s3); box-shadow: var(--sh-3);
        flex-direction: column; gap: var(--s2); width: min(78vw, 300px);
      }
      .api-popover.open { display: flex; animation: fadeUp var(--dur-2) var(--ease); }
      .api-row input { width: 100%; }
      .tweaks { right: var(--s3); left: var(--s3); width: auto; bottom: var(--s3); }
    }

    @media (max-width: 480px) {
      .bc-item { font-size: var(--fs-micro); letter-spacing: 0.08em; }
    }
  </style>
  <link rel="stylesheet" href="frontend/sports/mlb/live-indicators.css?v=pitch-colors-2">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="root"></div>

<!-- Component scripts (Babel-transpiled in the browser) -->
<script type="text/babel" src="frontend/shared/ui-atoms.jsx"></script>
<script type="text/babel" src="frontend/shared/tabs/common-tabs.jsx"></script>
<script type="text/babel" src="frontend/sports/mlb/live-indicators.jsx?v=reconnect-1"></script>
<script type="text/babel" src="frontend/sports/mlb/tabs.jsx?v=reconnect-1"></script>
<script type="text/babel" src="frontend/sports/nba/tabs.jsx"></script>
<script type="text/babel" src="frontend/sports/nfl/tabs.jsx?v=nfl-edge-2"></script>
<script type="text/babel" src="frontend/sports/nfl/live.jsx?v=stadium-1"></script>
<script type="text/babel" src="frontend/shared/screens/home-screen.jsx"></script>
<script type="text/babel" src="frontend/shared/screens/games-screen.jsx"></script>
<script type="text/babel" src="frontend/shared/screens/game-detail-screen.jsx?v=nfl-edge-1"></script>

<script type="text/babel">
/* ── TWEAK DEFAULTS ──────────────────────────────────── */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#00d4ff",
  "gridLines": true,
  "scanlines": true,
  "density": "comfortable"
}/*EDITMODE-END*/;

/* Hex → HSL channels, so the tweak panel can feed the theme engine.
   Returns rounded {h,s,l} (s/l as 0-100 numbers), or null on a bad string. */
function hexToHsl(hex) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(hex).trim());
  if (!m) return null;
  const r = parseInt(m[1], 16) / 255, g = parseInt(m[2], 16) / 255, b = parseInt(m[3], 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const l = (max + min) / 2;
  const d = max - min;
  let h = 0, s = 0;
  if (d) {
    s = d / (1 - Math.abs(2 * l - 1));
    if      (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else                h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return { h: Math.round(h), s: Math.round(s * 100), l: Math.round(l * 100) };
}

/* ── PARTICLE FIELD ──────────────────────────────────────
   A drifting 3D mote field behind the UI, projected by hand:
   each mote carries (x, y, z) in camera space and is drawn at
   screen = centre + (x, y) * (FOCAL / z). Moving z toward 0 makes a mote
   swell and accelerate outward, which is what sells depth — a 2D field of
   dots moving at one speed reads as dust on the lens instead.

   Deliberate choices worth not re-deriving:
   - It reads --accent-h EVERY frame from the computed root style, so the
     field re-colors with the sport theme for free (the theme engine animates
     that channel; a colour captured once would desync mid-transition).
   - It respects prefers-reduced-motion by painting ONE static frame rather
     than rendering nothing — the depth still reads, the motion doesn't.
   - The RAF is suspended on tab hide (visibilitychange), so a backgrounded
     PlayIQ costs nothing.
   - DPR is capped at 2: past that this is pure fill-rate for no visible gain
     on a field of soft dots. */
function ParticleField() {
  const ref = React.useRef(null);

  React.useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const FOCAL = 520;
    const DEPTH = 1400;
    const root = document.documentElement;

    let w = 0, h = 0, dpr = 1, motes = [], raf = 0, running = true;

    /* Count scales with area so a phone doesn't render a desktop's worth of
       motes, and is clamped so an ultrawide doesn't melt. */
    const targetCount = () => Math.max(28, Math.min(110, Math.round((w * h) / 24000)));

    const spawn = (atBack) => ({
      x: (Math.random() - 0.5) * w * 1.9,
      y: (Math.random() - 0.5) * h * 1.9,
      z: atBack ? DEPTH : 40 + Math.random() * DEPTH,
      r: 0.6 + Math.random() * 1.7,
      /* Per-mote speed keeps the field from moving as one rigid sheet. */
      v: 0.55 + Math.random() * 1.5,
      a: 0.18 + Math.random() * 0.55,
    });

    const resize = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const want = targetCount();
      while (motes.length < want) motes.push(spawn(false));
      if (motes.length > want) motes.length = want;
    };

    const draw = () => {
      const cs = getComputedStyle(root);
      const hue = parseFloat(cs.getPropertyValue('--accent-h')) || 193;
      const sat = cs.getPropertyValue('--accent-s').trim() || '100%';
      const cx = w / 2, cy = h / 2;

      ctx.clearRect(0, 0, w, h);

      for (const m of motes) {
        if (!reduced) {
          m.z -= m.v;
          /* Past the camera plane: recycle to the back rather than allocate. */
          if (m.z < 40) { Object.assign(m, spawn(true)); }
        }
        const k = FOCAL / m.z;
        const sx = cx + m.x * k;
        const sy = cy + m.y * k;
        if (sx < -40 || sx > w + 40 || sy < -40 || sy > h + 40) continue;

        const size = m.r * k * 1.6;
        /* Fade in from the far plane so motes don't pop into existence, and
           fade out again as they rush past, so none vanish mid-screen. */
        const depthFade = Math.min(1, (DEPTH - m.z) / 320) * Math.min(1, m.z / 260);
        const alpha = m.a * depthFade;
        if (alpha <= 0.004 || size < 0.15) continue;

        /* Near motes get a soft halo; far ones stay flat dots — the halo is
           the expensive part, so only the few large ones pay for it. */
        if (size > 1.6) {
          const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, size * 4);
          g.addColorStop(0, `hsl(${hue} ${sat} 72% / ${alpha * 0.55})`);
          g.addColorStop(1, `hsl(${hue} ${sat} 72% / 0)`);
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(sx, sy, size * 4, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = `hsl(${hue} ${sat} 82% / ${alpha})`;
        ctx.beginPath(); ctx.arc(sx, sy, size, 0, Math.PI * 2); ctx.fill();
      }
    };

    const loop = () => { if (!running) return; draw(); raf = requestAnimationFrame(loop); };

    const onVisibility = () => {
      if (document.hidden) { running = false; cancelAnimationFrame(raf); }
      else if (!reduced && !running) { running = true; loop(); }
    };

    resize();
    window.addEventListener('resize', resize);
    document.addEventListener('visibilitychange', onVisibility);
    if (reduced) { running = false; draw(); } else { loop(); }

    return () => {
      running = false;
      cancelAnimationFrame(raf);
      window.removeEventListener('resize', resize);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, []);

  return <canvas ref={ref} className="piq-particles" aria-hidden="true" />;
}

/* ── API KEY INPUT ───────────────────────────────────── */
/* Desktop: inline field. Mobile (<=720px): a key toggle that opens a popover,
   so the nav can never overflow on a 375px viewport. */
function ApiKeyInput() {
  const [val, setVal] = React.useState(() => localStorage.getItem('piq_key') || '');
  const [savedTick, setSavedTick] = React.useState(false);
  const [open, setOpen] = React.useState(false);
  const wrapRef = React.useRef(null);

  const hasKey = !!(localStorage.getItem('piq_key') || '').trim();

  const save = () => {
    const v = val.trim();
    if (v) localStorage.setItem('piq_key', v);
    else   localStorage.removeItem('piq_key');
    setSavedTick(true);
    setTimeout(() => setSavedTick(false), 1600);
  };

  // Dismiss the mobile popover on outside click / Escape
  React.useEffect(() => {
    if (!open) return;
    const onDown = e => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    const onKey  = e => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
  }, [open]);

  return (
    <div className="api-row" ref={wrapRef}>
      <button
        className={`api-toggle ${hasKey ? 'has-key' : ''}`}
        aria-expanded={open}
        aria-label={hasKey ? 'Claude API key saved — edit' : 'Add Claude API key'}
        title={hasKey ? 'Claude API key saved' : 'Add Claude API key'}
        onClick={() => setOpen(o => !o)}
      >⚿</button>

      <div className={`api-popover ${open ? 'open' : ''}`}>
        <label className="sr-only" htmlFor="piq-api-key">Claude API key</label>
        <input
          id="piq-api-key"
          type="password"
          value={val}
          onChange={e => setVal(e.target.value)}
          onKeyDown={e => { if (e.key === 'Enter') save(); }}
          placeholder="Claude API key (sk-ant-…)"
        />
        <button className="piq-btn piq-btn-primary" onClick={save}>SAVE</button>
        {savedTick && <span className="saved">● SAVED</span>}
      </div>
    </div>
  );
}

/* ── APP ROOT ────────────────────────────────────────── */
function App() {
  const [view, setView] = React.useState(() => {
    try { return JSON.parse(sessionStorage.getItem('piq_view') || '{}').view || 'home'; } catch { return 'home'; }
  });
  const [selectedSport, setSelectedSport] = React.useState('mlb');
  const [selectedGame, setSelectedGame] = React.useState(() => {
    try { const s = sessionStorage.getItem('piq_game'); return s ? JSON.parse(s) : null; } catch { return null; }
  });

  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  /* ── Theme engine ──────────────────────────────────────
     Every sport tab in the app paints with var(--cyan), which is now an
     alias for the themed --accent. Setting data-sport on <html> therefore
     re-colors the ENTIRE app — nav, cards, charts, gauges, glows — without
     any sport file knowing a theme exists. On the home screen we clear it
     so the picker shows each sport in its own color against neutral chrome. */
  const themeSport = view === 'home' ? null
    : (view === 'detail' ? (selectedGame?.sportKey || selectedSport) : selectedSport);

  React.useEffect(() => {
    const el = document.documentElement;
    if (themeSport) el.setAttribute('data-sport', themeSport);
    else el.removeAttribute('data-sport');
  }, [themeSport]);

  React.useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);

  /* The tweaks panel now drives the theme's HUE CHANNELS rather than setting
     --cyan directly. Writing --cyan would shadow the per-sport theme and
     freeze the app on one color; writing --accent-h/s/l keeps the whole
     derived palette (tints, lines, glows, --accent-2) coherent. */
  const applyAccentHex = hex => {
    const hsl = hexToHsl(hex);
    if (!hsl) return;
    const el = document.documentElement;
    el.style.setProperty('--accent-h', String(hsl.h));
    el.style.setProperty('--accent-s', hsl.s + '%');
    el.style.setProperty('--accent-l', hsl.l + '%');
  };

  const applyTweak = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
    if (key === 'accentColor') applyAccentHex(val);
    if (key === 'gridLines') {
      document.documentElement.style.setProperty('--grid-line', val ? '' : 'transparent');
      /* The perspective floor is the other half of "grid lines" — leaving it
         on would make the toggle look broken (flat grid gone, 3D one still
         running). Its colour is accent-derived, not --grid-line, so it needs
         its own switch. */
      document.documentElement.style.setProperty('--floor-opacity', val ? '' : '0');
    }
  };

  // Persist nav
  const goHome   = () => { setView('home');  sessionStorage.setItem('piq_view', JSON.stringify({ view:'home'  })); };
  const goGames  = (sport) => { setSelectedSport(sport); setView('games'); sessionStorage.setItem('piq_view', JSON.stringify({ view:'games' })); };
  const goDetail = (game)  => {
    setSelectedGame(game); setView('detail');
    sessionStorage.setItem('piq_game', JSON.stringify(game));
    sessionStorage.setItem('piq_view', JSON.stringify({ view:'detail' }));
  };

  // Restore detail view from session
  React.useEffect(() => {
    if (view === 'detail' && !selectedGame) setView('games');
  }, []);

  // Clickable breadcrumb trail — each ancestor navigates back to its screen.
  const crumbs = [{ label: 'PLAYIQ', onClick: view !== 'home' ? goHome : null }];
  if (view === 'games')  crumbs.push({ label: `${selectedSport.toUpperCase()} · TODAY'S GAMES` });
  if (view === 'detail') {
    crumbs.push({ label: (selectedGame?.sportKey || selectedSport).toUpperCase(), onClick: () => setView('games') });
    crumbs.push({ label: selectedGame ? `${selectedGame.awayAbbr} @ ${selectedGame.homeAbbr}` : '—' });
  }

  return (
    <>
      {/* Ambient backdrop — drifting accent blooms + a crawling scan bar.
          Purely decorative, inert to pointers, and hidden from a11y tools. */}
      <div className="piq-aurora" aria-hidden="true"><span /><span /><i /></div>

      {/* Depth layers, back to front: a perspective grid floor running toward
          the camera, then a projected 3D mote field. Both are accent-themed,
          inert to pointers, and sit under #root at z-index 0. */}
      <div className="piq-floor" aria-hidden="true" />
      <ParticleField />

      {/* Nav */}
      <nav className="topnav">
        <button className="brand" onClick={goHome} aria-label="PlayIQ home">
          <span className="brand-mark" aria-hidden="true">P</span>
          <span className="logo">PLAY<span>IQ</span></span>
        </button>
        <div className="nav-sep" aria-hidden="true" />
        <div className="nav-bc" aria-label="Breadcrumb">
          {crumbs.map((c, i) => (
            <React.Fragment key={i}>
              {i > 0 && <span className="bc-sep" aria-hidden="true">/</span>}
              <button
                className={`bc-item ${c.onClick ? 'link' : ''} ${i === crumbs.length - 1 ? 'current' : ''}`}
                onClick={c.onClick || undefined}
                disabled={!c.onClick}
                aria-current={i === crumbs.length - 1 ? 'page' : undefined}
              >{c.label}</button>
            </React.Fragment>
          ))}
        </div>
        <ApiKeyInput />
        <div className="nav-sep" aria-hidden="true" />
        <div className="nav-status" title={window.API_BASE || 'localhost:3001'}>
          <div className="nav-dot" />
          <span>{(window.API_BASE || 'localhost:3001').replace(/^https?:\/\//, '')}</span>
        </div>
      </nav>

      {/* Screens */}
      <main id="main">
        {view === 'home'   && <div className="screen-enter"><HomeScreen   onSelectSport={goGames} /></div>}
        {view === 'games'  && <div className="screen-enter"><GamesScreen  onSelectGame={goDetail} onBack={goHome} /></div>}
        {view === 'detail' && selectedGame && <div className="screen-enter"><GameDetailScreen game={selectedGame} onBack={() => setView('games')} /></div>}
      </main>

      {/* Tweaks */}
      <div className={`tweaks ${tweaksOpen ? 'open' : ''}`}>
        <div className="tw-title">TWEAKS</div>

        <div className="tw-row">
          <div className="tw-lbl">ACCENT COLOR</div>
          <div className="tw-opts">
            {[['#00d4ff','CYAN'],['#00ff88','GREEN'],['#ff6b35','EMBER'],['#a855f7','VIOLET'],['#ffd060','GOLD']].map(([c,l]) => (
              <button key={c} className={`tw-btn ${tweaks.accentColor===c?'on':''}`}
                style={tweaks.accentColor===c?{borderColor:c,color:c}:{}}
                onClick={() => applyTweak('accentColor', c)}>{l}</button>
            ))}
          </div>
        </div>

        <div className="tw-row">
          <div className="tw-lbl">GRID LINES</div>
          <div className="tw-opts">
            {[['true','ON'],['false','OFF']].map(([v,l]) => (
              <button key={v} className={`tw-btn ${String(tweaks.gridLines)===v?'on':''}`}
                onClick={() => applyTweak('gridLines', v==='true')}>{l}</button>
            ))}
          </div>
        </div>

        <div className="tw-row">
          <div className="tw-lbl">SCANLINES</div>
          <div className="tw-opts">
            {[['true','ON'],['false','OFF']].map(([v,l]) => (
              <button key={v} className={`tw-btn ${String(tweaks.scanlines)===v?'on':''}`}
                onClick={() => {
                  applyTweak('scanlines', v==='true');
                  document.documentElement.style.setProperty('--scanlines-opacity', v==='true'?'1':'0');
                }}>{l}</button>
            ))}
          </div>
        </div>
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
